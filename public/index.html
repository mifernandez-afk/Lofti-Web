<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lofti — Pronto en Santiago</title>
<meta name="description" content="Lofti: arriendos mas simples y seguros en Santiago de Chile. Pronto disponible.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brand:#6B1518;
  --match:#AEA432;
  --surface:#FFFFFF;
  --ink:#1F1B19;
  --home:#CEDAFF;
}
html,body{height:100%}
body{
  font-family:'Geist',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}
.content{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:clamp(24px,4vw,48px) 24px 24px;
}
.logo-wrap{
  margin-bottom:28px;
}
.logo-wrap img{
  height:80px;
  width:auto;
}
.kicker{
  font-family:'Geist',system-ui,sans-serif;
  font-size:0.74rem;
  font-weight:600;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--brand);
  margin-bottom:16px;
}
h1{
  font-family:'Newsreader',serif;
  font-size:clamp(2rem, 5vw, 3.2rem);
  font-weight:500;
  line-height:1.15;
  color:var(--ink);
  margin-bottom:24px;
  max-width:600px;
}
.desc{
  font-size:1rem;
  line-height:1.6;
  color:#5a5550;
  max-width:520px;
  margin-bottom:36px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #e5e0da;
  border-radius:100px;
  padding:10px 24px;
  font-size:0.875rem;
  color:var(--brand);
  font-weight:600;
}
.badge .dot{
  width:8px;
  height:8px;
  background:var(--match);
  border-radius:50%;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.5;transform:scale(0.8)}
}
.skyline{
  width:100%;
  flex:1;
  min-height:40vh;
  overflow:hidden;
  position:relative;
}
.skyline img{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:110%;
  max-width:none;
  height:auto;
}
@media(max-width:600px){
  .logo-wrap img{height:56px}
  .content{padding:24px 20px 12px}
  .logo-wrap{margin-bottom:16px}
  h1{margin-bottom:16px}
  .desc{margin-bottom:20px;font-size:0.9rem}
  .skyline img{width:180%}
}
</style>
</head>
<body>
<div class="content">
  <div class="logo-wrap">
    <img src="img/principal.png" alt="Lofti" height="80">
  </div>
  <p class="kicker">Arriendos mas simples y seguros</p>
  <h1>Todo tu arriendo,<br>en un solo lugar.</h1>
  <p class="desc">
    Encuentra un hogar, busca con quien compartirlo o publica tu propiedad.
    Lofti reune la busqueda y los pasos del arriendo en una experiencia clara.
  </p>
  <div class="badge">
    <span class="dot"></span>
    En desarrollo
  </div>
</div>
<div class="skyline">
  <img src="img/hero-city.webp" alt="Santiago de Chile, skyline con cordillera de los Andes" width="2000" height="667">
</div>
</body>
</html>
