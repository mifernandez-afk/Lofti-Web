<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lofti — Pronto en Santiago</title>
<meta name="description" content="Lofti: arriendos mas simples y seguros en Santiago de Chile. Pronto disponible.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --brand:#6B1518;
  --match:#AEA432;
  --surface:#F6F1EA;
  --ink:#1F1B19;
  --home:#CEDAFF;
}
body{
  font-family:'Geist',system-ui,sans-serif;
  background:var(--surface);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
  overflow:hidden;
}
.container{
  max-width:540px;
  width:100%;
  position:relative;
  z-index:1;
}
.logo-wrap{
  margin-bottom:16px;
}
.logo-wrap img{
  height:48px;
  width:auto;
}
.tagline{
  font-family:'Newsreader',serif;
  font-size:1.6rem;
  font-weight:400;
  color:var(--ink);
  line-height:1.3;
  margin-bottom:32px;
}
.divider{
  width:60px;
  height:3px;
  background:var(--match);
  margin:0 auto 32px;
  border-radius:2px;
}
.message{
  font-size:1rem;
  line-height:1.6;
  color:#5a5550;
  margin-bottom:40px;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:white;
  border:1px solid #e5e0da;
  border-radius:100px;
  padding:10px 24px;
  font-size:0.875rem;
  color:var(--brand);
  font-weight:500;
}
.badge .dot{
  width:8px;
  height:8px;
  background:var(--match);
  border-radius:50%;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.5;transform:scale(0.8)}
}
.skyline{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  pointer-events:none;
}
.skyline svg{
  display:block;
  width:100%;
  height:auto;
}
.footer{
  position:fixed;
  bottom:24px;
  font-size:0.75rem;
  color:rgba(107,21,24,0.4);
  z-index:2;
}
@media(max-width:480px){
  .logo-wrap img{height:36px}
  .tagline{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <img src="img/principal.png" alt="Lofti" height="48">
  </div>
  <div class="divider"></div>
  <h1 class="tagline">Estamos construyendo algo nuevo<br>para el arriendo en Santiago.</h1>
  <p class="message">
    Una plataforma que conecta arrendatarios y arrendadores con transparencia,
    contrato digital y pagos gestionados.<br>
    Pronto disponible.
  </p>
  <div class="badge">
    <span class="dot"></span>
    En desarrollo
  </div>
</div>
<div class="skyline">
  <svg viewBox="0 0 1200 120" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="
      M0 120 V75 h18 V55 h10 V75 h14 V42 h8 V75 h16 V60 h10 V75
      h18 V48 h8 V75 h14 V65 h10 V75 h16 V38 h10 V75 h12 V55 h8 V75
      h20 V50 h8 V75 h14 V62 h10 V75 h16 V44 h10 V75 h12 V58 h8 V75
      h18 V35 h12 V75 h14 V52 h8 V75 h16 V60 h10 V75 h20 V46 h8 V75
      h14 V56 h10 V75 h12 V40 h10 V75 h18 V58 h8 V75 h16 V50 h10 V75
      h14 V65 h8 V75 h20 V42 h10 V75 h12 V55 h8 V75 h16 V48 h10 V75
      h18 V60 h8 V75 h14 V38 h10 V75 h16 V52 h8 V75 h12 V62 h10 V75
      h20 V44 h8 V75 h14 V56 h10 V75 h18 V50 h8 V75 h16 V35 h12 V75
      h14 V58 h8 V75 h12 V46 h10 V75 h20 V55 h8 V75 h14 V40 h10 V75
      V120 Z
    " fill="var(--brand)" opacity="0.08"/>
    <path d="
      M0 120 V90 h20 V72 h8 V90 h16 V78 h10 V90 h18 V68 h8 V90
      h14 V80 h10 V90 h16 V74 h8 V90 h12 V82 h10 V90 h20 V70 h8 V90
      h14 V76 h10 V90 h18 V72 h8 V90 h16 V84 h10 V90 h12 V78 h8 V90
      h20 V66 h10 V90 h14 V80 h8 V90 h16 V74 h10 V90 h18 V82 h8 V90
      h14 V70 h10 V90 h12 V76 h8 V90 h20 V72 h10 V90 h16 V84 h8 V90
      h14 V68 h10 V90 h18 V78 h8 V90 h12 V74 h10 V90 h20 V80 h8 V90
      h14 V72 h10 V90 h16 V66 h10 V90 h18 V82 h8 V90 h12 V76 h8 V90
      h20 V70 h10 V90 h14 V84 h8 V90 h16 V78 h10 V90 h18 V72 h8 V90
      h14 V80 h10 V90 h12 V74 h8 V90
      V120 Z
    " fill="var(--brand)" opacity="0.05"/>
  </svg>
</div>
<div class="footer">Santiago, Chile</div>
</body>
</html>
